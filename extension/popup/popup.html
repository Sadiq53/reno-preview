<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crewvia Vanguard Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Crewvia Vanguard</h1>
          <span class="version-tag">Companion v1.0</span>
        </div>
      </div>
      <div class="status-indicator" id="statusPill" title="Sentinel Status">
        <span class="status-dot"></span>
        <span class="status-label">Active</span>
      </div>
    </header>

    <!-- Sentinel Banner -->
    <div class="sentinel-card">
      <div class="sentinel-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="sentinel-info">
        <div class="sentinel-title">Zero-Plugin Sentinel Active</div>
        <div class="sentinel-desc">Direct cookie injection & theme/plugin file editor guardrails enabled.</div>
      </div>
    </div>

    <!-- Active Sessions Section -->
    <section class="sessions-section">
      <div class="section-header">
        <h2>Active WordPress Sessions</h2>
        <span class="session-count" id="sessionCount">0</span>
      </div>

      <div id="sessionsList" class="sessions-list">
        <div class="empty-state" id="emptyState">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="3"/>
            <path d="M9 14v1"/>
            <path d="M9 19v2"/>
            <path d="M9 3v2"/>
            <path d="M9 9v1"/>
          </svg>
          <p>No active WordPress sessions.</p>
          <span>Launch any assigned project from your Crewvia Vanguard portal to begin.</span>
        </div>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <button class="btn-portal" id="btnOpenPortal">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open Crewvia Vanguard Portal
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
